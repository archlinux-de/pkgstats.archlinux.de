name: Update pnpm

on:
    schedule:
        - cron: "0 2 1 * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
              with:
                  token: ${{ secrets.MAINTENANCE_TOKEN }}
            - name: Fetch latest pnpm version and update package.json
              run: |
                  LATEST=$(npm view pnpm version)
                  npm pkg set packageManager=pnpm@${LATEST}
            - name: Run Common Setup
              uses: ./.github/actions/setup
            - name: Resolve golangci-lint version
              id: golangci-lint-version
              run: echo "version=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2@latest)" >> "$GITHUB_OUTPUT"
            - name: Install golangci-lint
              run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.golangci-lint-version.outputs.version }}
            - name: Update pnpm dependencies
              run: just update-pnpm
            - name: Migrate biome configuration
              run: pnpm biome migrate --write
            - name: Build Templates
              run: just build-templates
            - name: Format code
              run: just fmt
            - name: Run Linter
              run: just lint
            - name: Run Tests
              run: just test
            - name: Commit updates
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d #v7.2.0
              with:
                  commit_message: Update pnpm dependencies
                  commit_user_name: Maintenance Bob
                  commit_user_email: bob@archlinux.de
                  commit_author: Maintenance Bob <bob@archlinux.de>
